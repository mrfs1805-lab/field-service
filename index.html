<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>டெலிவரி லொகேஷன்</title>
  <style>
    body { font-family: Arial, "Noto Sans Tamil", sans-serif; max-width: 480px; margin: 20px auto; padding: 0 16px; color: #222; }
    h2 { text-align: center; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input[type=text] { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    #captureBtn { background: #1a73e8; color: #fff; }
    #submitBtn { background: #188038; color: #fff; }
    #locStatus { margin-top: 8px; font-size: 14px; color: #555; }
    iframe { width: 100%; height: 300px; border: 0; border-radius: 8px; margin-top: 14px; }
    .error { color: #c5221f; font-size: 14px; margin-top: 8px; }
    #statusLine { margin-top: 10px; font-size: 14px; text-align: center; padding: 8px; border-radius: 6px; background: #f1f3f4; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>டெலிவரி லொகேஷன்</h2>

  <!--
    🔧 SETUP: Google Cloud Console -> "Maps Embed API"-ஐ Enable செய்து
    பெறும் API Key-ஐ கீழே MAPS_EMBED_API_KEY இடத்தில் ஒட்டவும் (இலவசம்).
    இந்த கோப்பை GitHub Pages / Netlify போன்ற ஒரு HTTPS தளத்தில்
    host செய்யவும் - அப்போதுதான் Location பட்டன் வேலை செய்யும்.
  -->
  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby8-AVGi0EG4nTClxuCTKlGwRVLudYDzGmbJbiqcZ_zcmMg3iw_mFvK_Fzt_EPYY88M/exec";
    const MAPS_EMBED_API_KEY = "PASTE_YOUR_MAPS_EMBED_API_KEY_HERE";
  </script>

  <div id="formBlock">
    <label for="name">பெயர் (Name)</label>
    <input type="text" id="name" placeholder="உங்கள் பெயர்">

    <label for="address">முகவரி (Address)</label>
    <input type="text" id="address" placeholder="முழு முகவரி">

    <button id="captureBtn" onclick="captureLocation()">📍 லைவ் லொகேஷன் பிடி</button>
    <div id="locStatus"></div>

    <iframe id="myMap" class="hidden"></iframe>

    <button id="submitBtn" onclick="submitForm()" disabled>சமர்ப்பி (Submit)</button>
    <div id="formError" class="error"></div>
  </div>

  <div id="statusLine" class="hidden"></div>

  <script>
    let lat = null, lng = null, submissionId = null, pollTimer = null;

    function embedMap(elId, la, ln, label) {
      const el = document.getElementById(elId);
      el.classList.remove('hidden');
      el.src = 'https://www.google.com/maps/embed/v1/view?key=' +
        encodeURIComponent(MAPS_EMBED_API_KEY) + '&center=' + la + ',' + ln + '&zoom=16';
    }

    function captureLocation() {
      const status = document.getElementById('locStatus');
      const btn = document.getElementById('captureBtn');
      if (!navigator.geolocation) {
        status.textContent = 'இந்த சாதனத்தில் லொகேஷன் ஆதரிக்கப்படவில்லை.';
        return;
      }
      status.textContent = 'லொகேஷன் தேடப்படுகிறது...';
      btn.disabled = true;
      navigator.geolocation.getCurrentPosition(function (pos) {
        lat = pos.coords.latitude;
        lng = pos.coords.longitude;
        status.textContent = '✅ லொகேஷன் கிடைத்தது (' + lat.toFixed(5) + ', ' + lng.toFixed(5) + ')';
        btn.disabled = false;
        embedMap('myMap', lat, lng);
        document.getElementById('submitBtn').disabled = false;
      }, function (err) {
        status.textContent = '❌ லொகேஷன் பெற முடியவில்லை: ' + err.message;
        btn.disabled = false;
      }, { enableHighAccuracy: true, timeout: 15000 });
    }

    function submitForm() {
      const name = document.getElementById('name').value.trim();
      const address = document.getElementById('address').value.trim();
      const errorEl = document.getElementById('formError');
      errorEl.textContent = '';

      if (!name || !address) {
        errorEl.textContent = 'பெயர் மற்றும் முகவரியை நிரப்பவும்.';
        return;
      }
      if (!lat || !lng) {
        errorEl.textContent = 'முதலில் லொகேஷனை கேப்சர் செய்யவும்.';
        return;
      }

      submissionId = 'S' + Date.now() + Math.floor(Math.random() * 1000);
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'சமர்ப்பிக்கிறது...';

      fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ id: submissionId, name: name, address: address, lat: lat, lng: lng })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.success) {
            errorEl.textContent = 'பிழை: ' + (res.error || 'சமர்ப்பிப்பு தோல்வியடைந்தது');
            submitBtn.disabled = false;
            submitBtn.textContent = 'சமர்ப்பி (Submit)';
            return;
          }
          document.getElementById('name').disabled = true;
          document.getElementById('address').disabled = true;
          document.getElementById('captureBtn').disabled = true;
          submitBtn.disabled = true;
          submitBtn.textContent = 'சமர்ப்பிக்கப்பட்டது ✅';
          const statusLine = document.getElementById('statusLine');
          statusLine.classList.remove('hidden');
          statusLine.textContent = 'அட்மின் உறுதி செய்ய காத்திருக்கிறது... (Pending)';
          pollTimer = setInterval(pollLiveLocation, 8000);
          pollLiveLocation();
        })
        .catch(function (err) {
          errorEl.textContent = 'நெட்வொர்க் பிழை: ' + err.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'சமர்ப்பி (Submit)';
        });
    }

    function pollLiveLocation() {
      if (!submissionId) return;
      fetch(WEBAPP_URL + '?action=liveLocation&id=' + encodeURIComponent(submissionId))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          const statusLine = document.getElementById('statusLine');
          if (res.status === 'Pending') {
            statusLine.textContent = 'அட்மின் உறுதி செய்ய காத்திருக்கிறது... (Pending)';
          } else if (res.status === 'Approved') {
            statusLine.textContent = 'ஆர்டர் உறுதி செய்யப்பட்டது - டிரைவர் இன்னும் புறப்படவில்லை...';
          } else if (res.status === 'In Progress' && res.lat && res.lng) {
            statusLine.textContent = '🟢 டிரைவர் வழியில் இருக்கிறார் (கடைசி புதுப்பிப்பு: ' + res.updatedAt + ')';
            embedMap('myMap', res.lat, res.lng);
          }
        })
        .catch(function () { /* silent retry on next poll */ });
    }
  </script>
</body>
</html>
